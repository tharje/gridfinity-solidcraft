[package]
name = "gridfinity"
version = "1.7.1"
edition = "2021"
description = "Gridfinity bins and baseplates for SolidCraft"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
